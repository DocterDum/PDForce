name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $manifest" >&2
            exit 1
          fi

      - name: Build the zip
        run: |
          name="$(node -p "require('./manifest.json').name.toLowerCase().replace(/[^a-z0-9]+/g, '-')")"
          version="$(node -p "require('./manifest.json').version")"
          zip -r "$name-$version.zip" manifest.json src rules icons LICENSE README.md
          echo "ZIP=$name-$version.zip" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" "$ZIP"
          --title "$GITHUB_REF_NAME"
          --generate-notes
